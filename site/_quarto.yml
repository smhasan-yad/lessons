project:
  type: website
  resources:
    - graf-hip-ultrasound/**
    - logo.svg
    - logo-dark.svg
    - fonts/**
    - assets/**

website:
  title: "Radyssey"
  description: "Free interactive radiology lessons for residents: real images, overlays you can move, and self-tests."
  # RSS and share links use this. Change to https://radyssey.com/lessons when the domain is connected.
  site-url: https://radyssey.github.io/lessons
  favicon: favicon.svg
  search: true
  open-graph: true
  navbar:
    right:
      - text: Lessons
        href: index.qmd
      - text: Radyssey
        href: https://radyssey.github.io/
      - about.qmd
      - icon: rss
        href: index.xml
        aria-label: RSS feed
  page-footer:
    left: "For education only, not clinical advice."
    right:
      - text: "Suggest a topic or report an error"
        href: "https://github.com/Radyssey/lessons/issues/new?title=Suggestion%3A%20&body=What%20would%20you%20like%20to%20see%2C%20or%20what%20is%20wrong%3F%0A%0APage%3A%20"

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    include-in-header: _preload.html
    include-after-body: _m3.html
    lang: en
